name: Compilar y empaquetar

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore AdConnector.sln

      - name: Compilar
        run: dotnet build AdConnector.sln --configuration Release --no-restore

      # Paquete listo para copiar a IIS. El servidor necesita el
      # ASP.NET Core 8 Hosting Bundle instalado (aporta el modulo AspNetCoreModuleV2).
      - name: Publicar para IIS (win-x64)
        run: >
          dotnet publish src/AdConnector.Service/AdConnector.Service.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ./publish

      # Paquete NuGet de la biblioteca, para que otros backends de C# la consuman.
      - name: Empaquetar la biblioteca (NuGet)
        run: >
          dotnet pack src/AdConnector.Core/AdConnector.Core.csproj
          --configuration Release
          --output ./paquete

      - name: Subir paquete para IIS
        uses: actions/upload-artifact@v4
        with:
          name: AdConnector-IIS-win-x64
          path: ./publish
          retention-days: 30

      - name: Subir biblioteca (DLL + NuGet)
        uses: actions/upload-artifact@v4
        with:
          name: AdConnector-Core-dll
          path: |
            ./paquete/*.nupkg
            ./src/AdConnector.Core/bin/Release/netstandard2.0/AdConnector.Core.dll
            ./src/AdConnector.Core/bin/Release/net8.0/AdConnector.Core.dll
          retention-days: 30
